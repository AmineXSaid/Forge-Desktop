[package]
name = "forge-core"
description = "Forge Desktop's engine: the Claude Code CLI driver, sessions, providers, settings and git. No window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-stream = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
