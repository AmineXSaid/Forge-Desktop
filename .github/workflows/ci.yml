name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm
        run: |
          corepack enable
          pnpm --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: UI checks
        run: pnpm ui:check
      - name: UI unit tests
        run: pnpm ui:test
      - name: Rust tests
        run: cargo test --workspace
      - name: Installer
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: forge-desktop-installer
          path: target/release/bundle/nsis/*.exe
